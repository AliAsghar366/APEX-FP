[build]
  publish = "site/apexfx.com"
  functions = "netlify/functions"
  command = "echo 'No build needed - static site'"

[build.environment]
  NODE_VERSION = "20"

# Disable Netlify's asset optimization (minification/bundling) so it doesn't break pre-built Next.js files
[build.processing]
  skip_processing = true

[[redirects]]
  from = "/_next/image"
  to = "/.netlify/functions/image"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/strapi-proxy"
  status = 200

[[redirects]]
  from = "/cdn-cgi/*"
  to = "/cdn-stub.js"
  status = 200

[[redirects]]
  from = "/affiliate"
  to = "/affiliate.html"
  status = 200

[[redirects]]
  from = "/contact-us"
  to = "/contact-us.html"
  status = 200

[[redirects]]
  from = "/direct-to-sim-live"
  to = "/direct-to-sim-live.html"
  status = 200

[[redirects]]
  from = "/how"
  to = "/how.html"
  status = 200

[[redirects]]
  from = "/programs/expert"
  to = "/programs/expert.html"
  status = 200

[[redirects]]
  from = "/programs/standard"
  to = "/programs/standard.html"
  status = 200

[[headers]]
  for = "/*.webp"
  [headers.values]
    Content-Type = "image/webp"
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/*.avif"
  [headers.values]
    Content-Type = "image/avif"
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/*.png"
  [headers.values]
    Content-Type = "image/png"
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Content-Type = "image/svg+xml"
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/*.mp4"
  [headers.values]
    Content-Type = "video/mp4"
    Accept-Ranges = "bytes"
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/*.webm"
  [headers.values]
    Content-Type = "video/webm"
    Accept-Ranges = "bytes"
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
